<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8B5CF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Việc Của Tôi">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<title>Việc Của Tôi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#F8FAFC; --line:#E2E8F0; --line-2:#CBD5E1;
  --ink:#0F172A; --ink-2:#475569; --ink-3:#94A3B8;
  --blue:#1E5EFF; --blue-soft:#E8EFFF; --teal:#0E9F8E; --teal-soft:#E3F6F3;
  --red:#DC2626; --red-soft:#FDECEC; --amber:#B45309; --amber-soft:#FEF3E2; --green:#15803D; --green-soft:#E7F6EC;
  --r:12px; --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{font-size:15px;display:block}.brand small{color:var(--ink-3);font-size:11.5px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:0;background:none;text-align:left;font-weight:600;color:var(--ink-2);width:100%}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--blue-soft);color:var(--blue)}
.nav svg{width:18px;height:18px;flex:none}
.nbar{position:absolute;left:44px;right:12px;bottom:4px;height:3px;border-radius:3px;background:#EADFFB;overflow:hidden}.nbar i{display:block;height:100%;background:linear-gradient(90deg,#FF6FA8,#8B5CF6);border-radius:3px}
.nav{position:relative}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--ink-3);padding:8px;line-height:1.5}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* main */
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
.top .sub{color:var(--ink-3);font-size:13px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--line-2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#1A50DB}
.btn.danger{color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:0 4px}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-weight:600;color:var(--ink-2);font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
select.f{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:500}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card h3{margin:0;font-size:14px;font-weight:700}
.card .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
.card .bd{padding:12px 16px 16px}
.muted{color:var(--ink-3)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .1s}
.kpi:hover{transform:translateY(-2px)}
.kpi .l{font-size:12px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--mono);font-size:28px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi.alert .v{color:var(--red)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.grid2.even{grid-template-columns:1fr 1fr}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .1s}
.tip b{font-family:var(--mono)}
.hbar{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.hbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex;gap:2px}
.hbar .fill{height:100%;border-radius:0 4px 4px 0}
.hbar .n{font-family:var(--mono);text-align:right;color:var(--ink-2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* task rows */
.trow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface-2)}
.trow .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done-t{text-decoration:line-through;color:var(--ink-3)!important}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.p-high{background:var(--red-soft);color:var(--red)}
.p-med{background:var(--amber-soft);color:var(--amber)}
.p-low{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.due{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.due.over{color:var(--red);font-weight:600}
.due.today{color:var(--amber);font-weight:600}
.area-dot{width:8px;height:8px;border-radius:50%;flex:none}
.a-work{background:var(--blue)}.a-personal{background:var(--teal)}
.empty{padding:24px 10px;text-align:center;color:var(--ink-3);font-size:13px}
/* kanban */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:#EDF1F7;border-radius:var(--r);padding:10px;min-height:300px;transition:background .15s}
.col.over{background:var(--blue-soft);outline:2px dashed var(--blue)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700}
.col-h .n{font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--surface);border-radius:6px;padding:1px 7px}
.col-h .add{margin-left:auto;border:0;background:none;color:var(--ink-2);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.col-h .add:hover{background:var(--surface)}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(15,23,42,.04);border-left:3px solid var(--line-2)}
.kc.work{border-left-color:var(--blue)}.kc.personal{border-left-color:var(--teal)}
.kc:hover{border-color:var(--line-2)}
.kc.dragging{opacity:.4}
.kc .t{font-weight:600;line-height:1.4;margin-bottom:8px;word-break:break-word}
.kc .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.kc .foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
.mv{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;padding:2px 7px;color:var(--ink-2);font-weight:600}
.mv:hover{border-color:var(--blue);color:var(--blue)}
/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-h h2{margin:0 8px;font-size:17px;font-weight:800;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.cal .dn{padding:8px;font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.day{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;position:relative}
.day:hover{background:var(--surface-2)}
.day.out{background:#FAFBFC}.day.out .num{color:var(--ink-3)}
.day .num{font-family:var(--mono);font-size:12px;font-weight:600;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%}
.day.today .num{background:var(--blue);color:#fff}
.ce{display:block;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.ce.work{background:var(--blue-soft);border-color:var(--blue);color:#173E9E}
.ce.personal{background:var(--teal-soft);border-color:var(--teal);color:#0A5E55}
.ce.done{opacity:.5;text-decoration:line-through}
.ce.over{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.more{font-size:11px;color:var(--ink-2);margin-top:3px;font-weight:600}
/* table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);cursor:pointer;user-select:none;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.r{cursor:pointer}tr.r:hover td{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto}
.st{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st-todo{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.st-doing{background:var(--blue-soft);color:var(--blue)}
.st-done{background:var(--green-soft);color:var(--green)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.ov.show{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(15,23,42,.2)}
.modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:16px;font-weight:800}
.x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--ink-3);padding:2px 6px}
.modal .mb{padding:16px 20px;display:grid;gap:14px}
.modal .mf{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.fld input[type=text],.fld input[type=date],.fld textarea,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.fld textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.add{border-style:dashed}
.opt{display:flex;gap:6px}
.opt button{flex:1;border:1px solid var(--line);background:var(--surface);padding:8px 4px;white-space:nowrap;font-size:13px;border-radius:9px;font-weight:600;color:var(--ink-2)}
.opt button.on.o-high{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.opt button.on.o-med{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.opt button.on.o-low{background:var(--surface-2);border-color:var(--ink-2);color:var(--ink)}
.opt button.on.o-work{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.opt button.on.o-personal{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.opt button.on.o-st{background:var(--ink);border-color:var(--ink);color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.sync{font-size:11.5px;display:flex;align-items:center;gap:6px}
.mobnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:16px 14px 90px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid2.even{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .col{min-height:auto}
  .day{min-height:64px;padding:3px}
  .ce{font-size:0;height:6px;padding:0;margin-top:2px;border-left:0;border-radius:3px}
  .more{font-size:10px}
  .hide-m{display:none}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .mobnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px}
  .mobnav button.on{color:var(--blue)}
  .mobnav svg{width:20px;height:20px}
  .row2{grid-template-columns:1fr}
}

.lfbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.rday{float:right;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:#F1EAFF;color:#6A45D8;white-space:nowrap}
.rday.full{background:#DDF8EE;color:#0E7F5D}
@media (max-width:900px){.rday{float:none;display:block;font-size:9.5px;padding:1px 4px;margin-top:2px;text-align:center}}
#ov{z-index:55}
.dsum{font-weight:700;color:var(--ink-2);margin-bottom:6px}.dsum b{color:var(--blue)}
#ovE{z-index:56}
.hsum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.hs1{padding:12px 16px}.hs1 .l{font-size:12px;font-weight:800;color:var(--ink-2)}.hs1 .v{font-family:'Baloo 2',sans-serif;font-size:30px;font-weight:800;color:var(--blue);line-height:1.15}
.hgrid{padding:8px 12px}
.hrow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(7,minmax(34px,1fr)) 38px;align-items:center;gap:4px;padding:6px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hhead .hdy{text-align:center;font-size:11px;font-weight:800;color:var(--ink-3);line-height:1.2}.hhead .hdy b{display:block;font-size:14px;color:var(--ink-2);font-family:'Baloo 2',sans-serif}
.hhead .hdy.now,.hhead .hdy.now b{color:var(--blue)}
.hname{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;font-weight:800;padding:4px;min-width:0}
.hname span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hemo{font-size:20px;flex:none}
.hc{display:flex;justify-content:center}
.hbox{width:32px;height:32px;border-radius:10px;border:2px solid var(--line-2);background:#fff;font-weight:900;color:#fff;font-size:15px;padding:0;transition:transform .08s}
.hbox:hover:not(:disabled){border-color:var(--blue);transform:scale(1.08)}
.hbox.now{border-color:var(--blue)}
.hbox.on{background:linear-gradient(135deg,#34D399,#10B981);border-color:#10B981}
.hbox:disabled{background:#FAF7FD;border-style:dashed;border-color:var(--line);cursor:default}
.hst{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;color:#E8590C}
@media (max-width:900px){.hrow{grid-template-columns:repeat(7,minmax(0,1fr)) 24px;gap:3px}.hrow .hname{grid-column:1/-1}.hhead>div:first-child{display:none}.hc{padding-bottom:2px}.hbox{width:26px;height:26px;border-radius:8px;font-size:12px}.hname{font-size:13px;gap:5px}.hemo{font-size:16px}.hgrid{padding:6px 8px}}
.dsec{font-weight:800;font-size:13px;margin:14px 0 4px;color:var(--ink)}.dsec:first-child{margin-top:0}
.evstar{width:18px;text-align:center;flex:none}
.ce.event{background:#FFF3C4;border-color:#F5B400;color:#8A5A00}
.hev{display:inline-block;margin:8px 8px 0 0;border:0;background:#FFF3C4;color:#8A5A00;font-weight:800;font-size:12.5px;padding:4px 10px;border-radius:999px;cursor:pointer}
.dnav{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.dnav .dlab{min-width:120px;justify-content:center}
.dnav .dlab.cur{background:var(--blue-soft);color:var(--blue);border-color:#D9C8FF}
.chk.dis{border-style:dashed;opacity:.6}
.jcard{padding:18px 20px;margin-bottom:14px}
.jq{font-family:'Baloo 2',Nunito,sans-serif;font-weight:800;font-size:20px;margin-bottom:10px}
.jmoods{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.jmood{flex:1;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;transition:transform .1s}
.jmood span{font-size:26px;line-height:1}.jmood small{font-size:11px;font-weight:800;color:var(--ink-2)}
.jmood:hover{transform:translateY(-2px)}
.jmood.on{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 22%,#fff)}
#jText{width:100%;min-height:180px;padding:14px;border:2px solid var(--line);border-radius:16px;font:inherit;font-size:15px;line-height:1.6;resize:vertical;background:#FFFDF8}
.jfoot{display:flex;justify-content:flex-end;margin-top:6px;font-size:12px}
.jyl{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;padding:2px 6px}
.jstats{font-size:13px;color:var(--ink-2);margin-bottom:10px}.jstats b{color:var(--blue);font-size:15px}

/* ---------- state ---------- */
let items=[],tasks=[],routines=[];
let events=[],habits=[],journal={},buckets=[],achieves=[];
function split(){tasks=items.filter(x=>!x.kind);routines=items.filter(x=>x.kind==='routine');events=items.filter(x=>x.kind==='event');habits=items.filter(x=>x.kind==='habit');buckets=items.filter(x=>x.kind==='bucket');achieves=items.filter(x=>x.kind==='achieve');journal={};items.forEach(x=>{if(x.kind==='journal'&&x.date)journal[x.date]=x})}
const WD=[1,2,3,4,5,6,0];const WD_L={1:'T2',2:'T3',3:'T4',4:'T5',5:'T6',6:'T7',0:'CN'};
const S={view:'today',q:'',area:'all',pri:'',tag:'',calY:0,calM:0,sort:{k:'due',d:1}};
const now=new Date(); S.calY=now.getFullYear(); S.calM=now.getMonth();

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x};
const fmtDue=s=>{if(!s)return'';const d=parse(s);const t=parse(today());const diff=Math.round((d-t)/864e5);
  if(diff===0)return'Hôm nay';if(diff===1)return'Ngày mai';if(diff===-1)return'Hôm qua';
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+(d.getFullYear()!==t.getFullYear()?'/'+String(d.getFullYear()).slice(2):'')};
const dueCls=t=>{if(!t.due||t.status==='done')return'';const td=today();return t.due<td?'over':t.due===td?'today':''};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1800)}

/* ---------- storage ---------- */
const store={mode:'db',col:null,queues:{}};
function lsWrite(){}
function setSync(state){
  const el=$('#sync');
  const map={local:['#A79BC4','Chưa đăng nhập'],loading:['#B45309','Đang kết nối dữ liệu...'],db:['#15803D','Đã đồng bộ'],stale:['#B45309','Đang offline, sẽ đồng bộ khi có mạng'],err:['#DC2626','Lỗi lưu dữ liệu']};
  const [c,t]=map[state]||map.local; el.innerHTML='<span class="dot" style="background:'+c+';margin:0"></span>'+t;
}
function queueWrite(id,fn){
  const prev=store.queues[id]||Promise.resolve();
  const p=prev.then(fn).catch(e=>{console.error(e);setSync('err');toast(e&&e.code==='quota_exceeded'?'Hết dung lượng lưu trữ':'Không lưu được, thử lại sau')});
  store.queues[id]=p; return p;
}
function persist(t){
  if(store.col){const body=JSON.parse(JSON.stringify(t));queueWrite(t.id,()=>store.col.doc(t.id).set(body))}
  else lsWrite();
}
function removeStored(id){
  if(store.col)queueWrite(id,()=>store.col.doc(id).delete());
  else lsWrite();
}
let unsub=null,fbUser=null;
function initStore(){
  const show=(on)=>{$('#login').style.display=on?'none':'flex';$('#appRoot').style.display=on?'':'none';$('#mobNav').style.display=on?'':'none'};

  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(),db=firebase.firestore();

      else if(e&&e.code==='auth/popup-closed-by-user'){$('#lMsg').textContent=''}
      else{$('#lMsg').textContent='Không đăng nhập được: '+(e&&e.code||e)}}};
  auth.getRedirectResult().catch(e=>{$('#lMsg').textContent='Không đăng nhập được: '+(e&&e.code||e)});
  window.renderAcct=()=>{const u=fbUser;$('#acctBox').innerHTML=u?'<div class="fld"><label>👤 Tài khoản</label><div class="acct">'+(u.photoURL?'<img src="'+esc(u.photoURL)+'" alt="" referrerpolicy="no-referrer">':'')+'<span class="em">'+esc(u.displayName||'')+'<br><span class="muted">'+esc(u.email||'')+'</span></span><button class="btn sm" id="logout" type="button">Đăng xuất</button></div></div>':'';
    const lo=$('#logout');if(lo)lo.onclick=()=>{closeS();auth.signOut()}};
  auth.onAuthStateChanged(u=>{
    fbUser=u;if(unsub){unsub();unsub=null}

      items=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));split();
      if(!snap.metadata.fromCache){clearTimeout(timer);setSync('db')}
      render();
    },err=>{clearTimeout(timer);console.error(err);setSync('err');toast('Không tải được dữ liệu: '+(err.code||''))});
  });
}

/* ---------- filtering ---------- */
function filtered(){
  const q=S.q.trim().toLowerCase();
  return tasks.filter(t=>(S.area==='all'||t.area===S.area)&&(!S.pri||t.priority===S.pri)&&(!S.tag||(t.tags||[]).includes(S.tag))&&
    (!q||(t.title+' '+(t.notes||'')+' '+(t.tags||[]).join(' ')).toLowerCase().includes(q)));
}
const byDue=(a,b)=>(a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:PRI_ORD[a.priority]-PRI_ORD[b.priority];
function allTags(){const s=new Set(PRESET_TAGS);tasks.forEach(t=>(t.tags||[]).forEach(x=>s.add(x)));return[...s]}

/* ---------- task mutations ---------- */
function upsert(t){const i=items.findIndex(x=>x.id===t.id);if(i>=0)items[i]=t;else items.push(t);split();persist(t);render()}
function setStatus(id,st,onDay){const t=tasks.find(x=>x.id===id);if(!t||t.status===st)return;
  const at=st!=='done'?null:(onDay&&onDay<today()?new Date(parse(onDay).setHours(17)).toISOString():new Date().toISOString());
  const n=Object.assign({},t,{status:st,doneAt:at,updatedAt:new Date().toISOString()});upsert(n);
  if(st==='done')toast(onDay&&onDay<today()?'✓ Đã tick bù':'🎉 Hoàn thành rồi, giỏi quá!')}
function toggleDone(id){const t=tasks.find(x=>x.id===id);if(t)setStatus(id,t.status==='done'?'todo':'done')}
function del(id){items=items.filter(t=>t.id!==id);split();removeStored(id);render();toast('Đã xoá')}

/* ---------- shell render ---------- */
function renderNav(){
  const ts=todayStats(tasks,todayRoutines(true));
  const prog='<span class="cnt">'+ts.done+'/'+ts.total+'</span>';
  const bar=ts.total?'<span class="nbar"><i style="width:'+(ts.done/ts.total*100)+'%"></i></span>':'';
  const nb=v=>'<button class="nav'+(S.view===v.id?' on':'')+'" data-view="'+v.id+'">'+ICONS[v.id]+v.name+(v.id==='today'?prog+bar:'')+'</button>';

  $('#navList').innerHTML=VIEWS.filter(v=>!v.more).map(nb).join('')+
    '<button class="nav navmore" data-moretoggle>'+ICONS.more+'Khác<span class="cnt">'+(moreOpen?'▾':'▸')+'</span></button>'+(moreOpen?'<div class="subnav">'+VIEWS.filter(v=>v.more).map(nb).join('')+'</div>':'');

  $('#mobNav').innerHTML=MOB_MAIN.map(id=>{const v=VIEWS.find(x=>x.id===id);return'<button class="'+(S.view===id?'on':'')+'" data-view="'+id+'">'+ICONS[id]+(id==='today'&&ts.total?v.name+' '+ts.done+'/'+ts.total:v.name)+'</button>'}).join('')+
    '<button class="'+(inMore?'on':'')+'" data-mobmore>'+ICONS.more+(inMore?VIEWS.find(x=>x.id===S.view).name:'Thêm')+'</button>';
  $('#areaSeg').innerHTML=[['all','Tất cả'],['work','Công ty'],['personal','Cá nhân']].map(([k,l])=>'<button class="'+(S.area===k?'on':'')+'" data-area="'+k+'">'+l+'</button>').join('');
  const tags=allTags(); if(S.tag&&!tags.includes(S.tag))S.tag='';
  $('#fTag').innerHTML='<option value="">Mọi nhãn</option>'+tags.map(t=>'<option'+(S.tag===t?' selected':'')+'>'+esc(t)+'</option>').join('');

  $('#subtitle').textContent=wd+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
}
function render(){

  if(S.view==='bucket')v.innerHTML=viewBucket();

  else if(S.view==='habits')v.innerHTML=viewHabits();

  else if(S.view==='kanban')v.innerHTML=viewKanban();

}

/* ---------- pieces ---------- */
function priPill(p){return'<span class="pill p-'+p+'">'+PRI[p]+'</span>'}
function tagsHtml(t,max){const tg=t.tags||[];const sh=tg.slice(0,max||9);return sh.map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+(tg.length>sh.length?'<span class="tag">+'+(tg.length-sh.length)+'</span>':'')}
function dueHtml(t){return t.due?'<span class="due '+dueCls(t)+'">'+fmtDue(t.due)+'</span>':''}
function rowHtml(t){
  return'<div class="trow" data-open="'+t.id+'"><button class="chk'+(t.status==='done'?' on':'')+'" data-done="'+t.id+'" aria-label="Hoàn thành"></button>'+
  '<span class="area-dot a-'+t.area+'"></span><span class="t'+(t.status==='done'?' done-t':'')+'">'+esc(t.title)+'</span>'+
  '<span class="hide-m" style="display:flex;gap:4px">'+tagsHtml(t,1)+'</span>'+priPill(t.priority)+dueHtml(t)+'</div>';
}

/* ---------- dashboard ---------- */
let chartData=[];
function viewDashboard(){
  const F=filtered(); const td=today();
  const open=F.filter(t=>t.status!=='done');
  const over=open.filter(t=>t.due&&t.due<td);
  const dueToday=open.filter(t=>t.due===td);
  const wk0=mondayOf(new Date());
  const doneWeek=F.filter(t=>t.status==='done'&&t.doneAt&&new Date(t.doneAt)>=wk0);
  const doing=open.filter(t=>t.status==='doing').length;
  // weekly chart: last 8 weeks
  chartData=[];
  for(let i=7;i>=0;i--){const s=addDays(wk0,-7*i),e=addDays(s,7);
    const n=F.filter(t=>t.status==='done'&&t.doneAt&&new Date(t.doneAt)>=s&&new Date(t.doneAt)<e);
    chartData.push({label:pad(s.getDate())+'/'+pad(s.getMonth()+1),range:pad(s.getDate())+'/'+pad(s.getMonth()+1)+' – '+pad(addDays(e,-1).getDate())+'/'+pad(addDays(e,-1).getMonth()+1),
      work:n.filter(t=>t.area==='work').length,personal:n.filter(t=>t.area==='personal').length})}
  const kpi=(l,v,s,cls,go)=>'<button class="card kpi '+(cls||'')+'" data-kpi="'+go+'" title="Bấm để xem"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+' →</div></button>';
  const priRows=['high','med','low'].map(p=>{const w=open.filter(t=>t.priority===p&&t.area==='work').length,pe=open.filter(t=>t.priority===p&&t.area==='personal').length;return{p,w,pe,n:w+pe}});
  const maxP=Math.max(1,...priRows.map(r=>r.n));
  const focus=[...over,...dueToday].sort(byDue);
  const td7=ymd(addDays(new Date(),7));
  const upcoming=open.filter(t=>t.due&&t.due>td&&t.due<=td7).sort(byDue);
  const noDue=open.filter(t=>!t.due).sort((a,b)=>PRI_ORD[a.priority]-PRI_ORD[b.priority]);
  const dl=c=>'<span class="dot" style="background:'+c+';margin:0"></span>';
  return'<div class="kpis">'+
    kpi('📋 Đang mở',open.length,doing+' việc đang làm','','open')+
    kpi('🔥 Quá hạn',over.length,over.length?'Cần xử lý ngay':'Không có việc trễ',over.length?'alert':'','over')+
    kpi('⏰ Đến hạn hôm nay',dueToday.length,'Xem màn hình Hôm nay','','today')+
    kpi('🎉 Hoàn thành tuần này',doneWeek.length,'Từ thứ 2, '+pad(wk0.getDate())+'/'+pad(wk0.getMonth()+1),'','doneweek')+
  '</div><div class="grid2">'+
    '<div class="card"><div class="hd"><h3>Việc hoàn thành theo tuần</h3><span class="muted" style="font-size:12px">8 tuần gần nhất</span></div><div class="bd"><div class="chart" id="chart">'+chartSvg()+'<div class="tip" id="tip"></div></div>'+
    '<div class="legend"><span><i style="background:var(--work)"></i>Công ty</span><span><i style="background:var(--teal)"></i>Cá nhân</span></div></div></div>'+

function chartSvg(){

  const bw=Math.min(34,iw/chartData.length*0.55);let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ việc hoàn thành theo tuần">';
  for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#F1E6FF" '+(i?'stroke-dasharray="2 3"':'')+'/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" font-family="Baloo 2, Nunito, sans-serif" fill="#A79BC4">'+step*i+'</text>'}
  chartData.forEach((d,i)=>{const cx=L+iw*(i+.5)/chartData.length,x=cx-bw/2;
    const hw=ih*d.work/top,hp=ih*d.personal/top;let y=T+ih;

function barPath(x,y,w,h,r,c){r=Math.min(r,h,w/2);return'<path d="M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z" fill="'+c+'"/>'}

/* ---------- kanban ---------- */
function viewKanban(){
  const F=filtered();
  return'<div class="board">'+['todo','doing','done'].map(st=>{
    let items=F.filter(t=>t.status===st);
    items=st==='done'?items.sort((a,b)=>(b.doneAt||'')<(a.doneAt||'')?-1:1).slice(0,30):items.sort(byDue);
    const total=F.filter(t=>t.status===st).length;
    return'<div class="col" data-col="'+st+'"><div class="col-h"><span class="st st-'+st+'">'+ST_EMO[st]+ST[st]+'</span><span class="n">'+total+'</span><button class="add" data-addst="'+st+'" title="Thêm việc">+</button></div>'+
      (items.length?items.map(kcard).join(''):'<div class="empty">Kéo thả việc vào đây</div>')+
      (st==='done'&&total>30?'<div class="muted" style="font-size:12px;text-align:center">Hiển thị 30 việc gần nhất</div>':'')+'</div>';
  }).join('')+'</div>';
}
function kcard(t){
  const nx=NEXT_ST[t.status];const lbl={doing:'Bắt đầu →',done:'Xong ✓',todo:'Mở lại'}[nx];
  return'<div class="kc '+t.area+'" draggable="true" data-id="'+t.id+'" data-open="'+t.id+'"><div class="t'+(t.status==='done'?' done-t':'')+'">'+esc(t.title)+'</div>'+
    '<div class="meta">'+priPill(t.priority)+tagsHtml(t,3)+'</div><div class="foot">'+(dueHtml(t)||'<span class="muted" style="font-size:11.5px">'+AREA[t.area]+'</span>')+
    '<button class="mv" data-move="'+t.id+'" data-to="'+nx+'">'+lbl+'</button></div></div>';
}

/* ---------- calendar ---------- */
function routineDay(k,d,td){if(k>td)return null;
  const rs=routines.filter(r=>r.active!==false&&isSched(r,d)&&(!r.createdAt||ymd(new Date(r.createdAt))<=k)&&(S.area==='all'||r.area===S.area));
  if(!rs.length)return null;return{n:rs.filter(r=>rDone(r,k)).length,t:rs.length}}
const evDay=k=>events.filter(e=>e.date===k);
function viewCalendar(){
  const F=filtered();const y=S.calY,m=S.calM;const first=new Date(y,m,1);const start=mondayOf(first);const td=today();
  const byDay={};F.forEach(t=>{if(t.due)(byDay[t.due]=byDay[t.due]||[]).push(t)});
  let cells='';for(let i=0;i<42;i++){const d=addDays(start,i);if(i>=35&&d.getMonth()!==m)break;const k=ymd(d);const list=(byDay[k]||[]).sort((a,b)=>(a.status==='done')-(b.status==='done')||PRI_ORD[a.priority]-PRI_ORD[b.priority]);
    const rp=routineDay(k,d,td);
    cells+='<div class="day'+(d.getMonth()!==m?' out':'')+(k===td?' today':'')+'" data-day="'+k+'"><span class="num">'+d.getDate()+'</span>'+
      (rp?'<span class="rday'+(rp.n===rp.t?' full':'')+'" title="Việc hằng ngày: xong '+rp.n+'/'+rp.t+'">'+(rp.n===rp.t?'✓':'🔁')+' '+rp.n+'/'+rp.t+'</span>':'')+
      evDay(k).map(e=>'<span class="ce event" data-eedit="'+e.id+'" title="'+esc(e.title)+'">⭐ '+esc(e.title)+'</span>').join('')+
      list.slice(0,Math.max(1,3-evDay(k).length)).map(t=>'<span class="ce '+t.area+(t.status==='done'?' done':'')+(dueCls(t)==='over'?' over':'')+'" data-open="'+t.id+'" title="'+esc(t.title)+'">'+esc(t.title)+'</span>').join('')+
      (list.length>Math.max(1,3-evDay(k).length)?'<div class="more">+'+(list.length-Math.max(1,3-evDay(k).length))+' việc</div>':'')+'</div>'}
  const noDue=F.filter(t=>!t.due&&t.status!=='done');
  return'<div class="cal-h"><button class="btn sm" data-cal="-1">‹</button><h2>Tháng '+(m+1)+', '+y+'</h2><button class="btn sm" data-cal="1">›</button><button class="btn sm" data-cal="0">Hôm nay</button>'+
    '<span class="spacer"></span><span class="muted hide-m" style="font-size:12px">Bấm vào ngày để xem chi tiết</span></div>'+
    '<div class="cal">'+['T2','T3','T4','T5','T6','T7','CN'].map(x=>'<div class="dn">'+x+'</div>').join('')+cells+'</div>'+
    monthDetail(F,y,m)+
    (noDue.length?'<div class="card" style="margin-top:14px"><div class="hd"><h3>Chưa đặt hạn ('+noDue.length+')</h3></div><div class="bd">'+noDue.sort((a,b)=>PRI_ORD[a.priority]-PRI_ORD[b.priority]).map(rowHtml).join('')+'</div></div>':'');
}
function monthDetail(F,y,m){
  // mobile-friendly agenda of this month
  const pre=y+'-'+pad(m+1)+'-';const list=F.filter(t=>t.due&&t.due.startsWith(pre)).sort(byDue);
  return'<div class="card" style="margin-top:14px"><div class="hd"><h3>Lịch trình tháng '+(m+1)+' ('+list.length+')</h3></div><div class="bd">'+(list.length?list.map(rowHtml).join(''):'<div class="empty">Không có việc nào có hạn trong tháng này.</div>')+'</div></div>';
}

/* ---------- list ---------- */
const LF={open:'Đang mở',over:'Quá hạn',doneweek:'Hoàn thành tuần này'};
function viewList(){
  const td=today(),wk0=mondayOf(new Date());
  const F=filtered().filter(t=>!S.lf||(S.lf==='open'?t.status!=='done':S.lf==='over'?t.status!=='done'&&t.due&&t.due<td:t.status==='done'&&t.doneAt&&new Date(t.doneAt)>=wk0));const{k,d}=S.sort;
  const chip=S.lf?'<div class="lfbar">Đang lọc: <b>'+LF[S.lf]+'</b> <button class="chip" data-lfclear>✕ Bỏ lọc</button></div>':'';
  const val={title:t=>t.title.toLowerCase(),area:t=>t.area,priority:t=>PRI_ORD[t.priority],status:t=>['todo','doing','done'].indexOf(t.status),due:t=>t.due||'9999'};
  F.sort((a,b)=>{const x=val[k](a),y=val[k](b);return(x<y?-1:x>y?1:0)*d||byDue(a,b)});
  const th=(key,l,cls)=>'<th data-sort="'+key+'" class="'+(cls||'')+'">'+l+(k===key?(d>0?' ↑':' ↓'):'')+'</th>';
  return chip+'<div class="card tbl-wrap"><table><thead><tr><th style="width:36px"></th>'+th('title','Công việc')+th('area','Khu vực','hide-m')+th('priority','Ưu tiên')+th('status','Trạng thái','hide-m')+th('due','Hạn')+'<th class="hide-m">Nhãn</th></tr></thead><tbody>'+
  (F.length?F.map(t=>'<tr class="r" data-open="'+t.id+'"><td><button class="chk'+(t.status==='done'?' on':'')+'" data-done="'+t.id+'"></button></td>'+
    '<td style="font-weight:600" class="'+(t.status==='done'?'done-t':'')+'">'+esc(t.title)+'</td>'+
    '<td class="hide-m"><span class="area-dot a-'+t.area+'" style="display:inline-block;margin-right:6px"></span>'+AREA[t.area]+'</td>'+
    '<td>'+priPill(t.priority)+'</td><td class="hide-m"><span class="st st-'+t.status+'">'+ST[t.status]+'</span></td>'+
    '<td>'+(dueHtml(t)||'<span class="muted">—</span>')+'</td><td class="hide-m"><div style="display:flex;gap:4px;flex-wrap:wrap">'+tagsHtml(t,3)+'</div></td></tr>').join('')
  :'<tr><td colspan="7"><div class="empty">Không có công việc phù hợp bộ lọc.</div></td></tr>')+'</tbody></table></div>';
}

  else if(e.key==='Escape'&&$('#ovS').classList.contains('show'))closeS();
  else if(e.key==='Escape'&&$('#ovG').classList.contains('show'))closeG();
  else if(e.key==='Escape'&&$('#ovM').classList.contains('show'))$('#ovM').classList.remove('show');
  else if(e.key==='Escape'&&$('#ovD').classList.contains('show'))closeDay();
  if(e.key==='Escape'&&$('#ovR').classList.contains('show'))closeR();
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!typing&&S.view==='today'&&!document.querySelector('.ov.show')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){S.day=ymd(addDays(parse(S.day||today()),e.key==='ArrowLeft'?-1:1));render()}
  if(!typing&&!$('#ov').classList.contains('show')&&!$('#ovR').classList.contains('show')&&!$('#ovD').classList.contains('show')&&!$('#ovE').classList.contains('show')&&!document.querySelector('.ov.show')&&(e.key==='n'||e.key==='N')&&!e.metaKey&&!e.ctrlKey){e.preventDefault();openModal(null)}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&$('#ov').classList.contains('show'))save();
});
// drag & drop
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.kc');if(!c)return;dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('.kc');if(c)c.classList.remove('dragging');document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();col.classList.remove('over');setStatus(dragId,col.dataset.col);dragId=null});

/* ---------- routing ---------- */
function go(v,lf){if(!VIEWS.some(x=>x.id===v))v='today';jFlush();const om=$('#ovM');if(om)om.classList.remove('show');S.view=v;S.lf=lf||'';if(v==='today')S.day=today();if(v==='journal'){S.jd=today();S.jy=new Date().getFullYear()}if(location.hash.slice(1)!==v){try{history.replaceState(null,'','#'+v)}catch(_){location.hash=v}}render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==S.view)go(h)});
S.view=VIEWS.some(x=>x.id===location.hash.slice(1))?location.hash.slice(1):'today';
initStore();
})();
</script>
